project:
  name: "mifos-conventions-gradle"
  version: "0.1.0-SNAPSHOT"
  license: "MPL-2.0"
  inceptionYear: "2026"
  vendor: "Mifos Initiative"
  copyright: "Copyright (c) 2026 Mifos Initiative"
  authors:
    - "Aleksandar Vidakovic"
  links:
    bugTracker: "https://mifosforge.jira.com"
    contribute: "https://mifos.org"
    documentation: "https://docs.mifos.org"
    donation: "https://mifos.org/take-action/donation-options"
    faq: "https://mifos.org/resources/support"
    contact: "https://mifos.org/about-us/contact-us"

signing:
  pgp:
    active: ALWAYS
    armored: true

catalog:
  sbom:
    syft:
      active: ALWAYS
  swid:
    mifos:
      active: ALWAYS

release:
  github:
    enabled: true
    # TODO: change this to "openmf"!
    owner: "monkeysintown"
    tagName: v{{projectVersion}}
    overwrite: true
    commitAuthor:
      name: "Aleksandar Vidakovic"
      email: "aleks@mifos.org"

deploy:
  maven:
    artifactory:
      mifos:
        active: ALWAYS
        url: "https://mifos.jfrog.io/artifactory/mifosx-gradle-local"
        authorization: BEARER
        snapshotSupported: true
        applyMavenCentralRules: false
        stagingRepositories:
          - "modules/gradle/config/asciidoc/build/staging-deploy"
          - "modules/gradle/config/checkstyle/build/staging-deploy"
          - "modules/gradle/config/compose/build/staging-deploy"
          - "modules/gradle/config/docker/build/staging-deploy"
          - "modules/gradle/config/eclipse/build/staging-deploy"
          - "modules/gradle/config/env/build/staging-deploy"
          - "modules/gradle/config/jqassistant/build/staging-deploy"
          - "modules/gradle/config/jreleaser/build/staging-deploy"
          - "modules/gradle/config/licenses/build/staging-deploy"
          - "modules/gradle/config/lombok/build/staging-deploy"
          - "modules/gradle/config/plantuml/build/staging-deploy"
          - "modules/gradle/config/postgresql/build/staging-deploy"
          - "modules/gradle/config/spotbugs/build/staging-deploy"
